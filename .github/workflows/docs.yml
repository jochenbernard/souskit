name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deployments are queued rather than cancelled, so an in-flight deployment is
# never left half applied.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Swift 6.3 is required by the swift-tools-version in Package.swift.
  XCODE_VERSION: "26.6"
  # The site is served from https://jochenbernard.github.io/souskit, so every
  # generated link needs the repository name as its base path.
  HOSTING_BASE_PATH: souskit

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Select the Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Restore the dependency cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-deps-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-deps-xcode${{ env.XCODE_VERSION }}-

      - name: Generate the documentation
        run: |
          swift package --allow-writing-to-directory docs-site \
            generate-documentation \
            --target SousCore \
            --target SousKit \
            --enable-experimental-combined-documentation \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path "$HOSTING_BASE_PATH" \
            --output-path docs-site

      - name: Redirect the site root to the documentation landing page
        run: |
          cat > docs-site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=/$HOSTING_BASE_PATH/documentation/">
          <link rel="canonical" href="/$HOSTING_BASE_PATH/documentation/">
          <title>SousKit Documentation</title>
          </head>
          <body>
          <a href="/$HOSTING_BASE_PATH/documentation/">SousKit Documentation</a>
          </body>
          </html>
          HTML

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
